<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancla - Recupera tu tiempo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f1119;
            --sidebar-bg: #151823;
            --sidebar-hover: #1e2132;
            --accent: #5b8def;
            --accent-hover: #4a7de0;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0b4;
            --text-muted: #6b7280;
            --card-bg: #1c1f2e;
            --card-border: #2a2d3d;
            --danger: #ef5a5a;
            --warning: #f0a050;
            --success: #4caf84;
            --bar-whatsapp: #25d366;
            --bar-instagram: #e4405f;
            --bar-youtube: #ff0000;
            --bar-facebook: #1877f2;
            --shadow: 0 4px 24px rgba(0,0,0,0.25);
            --radius: 14px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg-dark); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }

        .auth-container { display:flex; align-items:center; justify-content:center; width:100%; height:100vh; background:radial-gradient(ellipse at center, #1a1f35 0%, #0a0c16 70%); position:relative; overflow:hidden; }
        .auth-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:18px; padding:40px 36px; width:420px; max-width:92vw; box-shadow:var(--shadow); position:relative; z-index:1; }
        .auth-card .logo-area { text-align:center; margin-bottom:28px; }
        .auth-card .logo-icon { display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; background:var(--accent); border-radius:50%; font-size:26px; color:#fff; margin-bottom:8px; }
        .auth-card h2 { font-size:1.6rem; font-weight:700; color:#fff; }
        .auth-card .subtitle { font-size:0.9rem; color:var(--text-secondary); margin-top:4px; }
        .auth-card .input-group { margin-bottom:16px; position:relative; }
        .auth-card .input-group i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:0.95rem; }
        .auth-card .input-group i.toggle-password { left:auto; right:14px; cursor:pointer; z-index:2; pointer-events:auto; }
        .auth-card input { width:100%; padding:13px 40px; background:#222636; border:1px solid var(--card-border); border-radius:var(--radius-sm); color:#e8eaed; font-size:0.95rem; outline:none; }
        .auth-card input:focus { border-color:var(--accent); }
        .auth-card .btn-primary { width:100%; padding:13px; background:var(--accent); color:#fff; border:none; border-radius:var(--radius-sm); font-size:1rem; font-weight:600; cursor:pointer; margin-top:4px; }
        .auth-card .btn-primary:hover { background:var(--accent-hover); }
        .auth-card .toggle-link { text-align:center; margin-top:16px; font-size:0.9rem; color:var(--text-secondary); }
        .auth-card .toggle-link a { color:var(--accent); cursor:pointer; font-weight:500; }
        .auth-form { display:none; }
        .auth-form.active { display:block; }
        .auth-msg { text-align:center; font-size:0.85rem; margin-top:8px; min-height:20px; }
        .auth-msg.error { color:var(--danger); }
        .auth-msg.success { color:var(--success); }

        .dashboard { display:none; width:100%; height:100vh; flex-direction:row; }
        .dashboard.active { display:flex; }
        .sidebar { width:240px; min-width:240px; background:var(--sidebar-bg); border-right:1px solid var(--card-border); display:flex; flex-direction:column; padding:20px 14px; }
        .sidebar .side-logo { display:flex; align-items:center; gap:10px; padding:8px 10px 20px; font-size:1.3rem; font-weight:700; color:#fff; border-bottom:1px solid var(--card-border); margin-bottom:8px; }
        .sidebar .side-logo .logo-dot { width:34px; height:34px; background:var(--accent); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; }
        .sidebar nav { display:flex; flex-direction:column; gap:4px; flex:1; }
        .sidebar nav a { display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:var(--radius-sm); color:var(--text-secondary); text-decoration:none; cursor:pointer; }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(91,141,239,0.15); color:var(--accent); }
        .sidebar .logout-btn { display:flex; align-items:center; gap:11px; padding:11px 14px; color:#d97a7a; cursor:pointer; background:none; border:none; margin-top:auto; font-size:0.93rem; }

        .main-content { flex:1; overflow-y:auto; padding:28px 32px; background:var(--bg-dark); }
        .section-panel { display:none; }
        .section-panel.active { display:block; }
        .cards-row { display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:20px; }
        .stat-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:18px 20px; display:flex; align-items:center; gap:14px; }
        .stat-card .stat-icon { width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; }
        .stat-icon.red { background:rgba(239,90,90,0.2); color:var(--danger); }
        .stat-icon.orange { background:rgba(240,160,80,0.2); color:var(--warning); }
        .stat-icon.blue { background:rgba(91,141,239,0.2); color:var(--accent); }
        .stat-value { font-size:1.5rem; font-weight:700; color:#fff; }
        .stat-label { font-size:0.8rem; color:var(--text-secondary); }
        .chart-container { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:24px 20px 16px; margin-bottom:18px; }
        .bar-chart { display:flex; align-items:flex-end; gap:14px; height:220px; padding-bottom:28px; border-bottom:2px solid var(--card-border); }
        .bar-wrapper { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
        .bar { width:100%; max-width:55px; border-radius:8px 8px 4px 4px; min-width:28px; }
        .bar-value { font-size:0.78rem; color:#ccc; text-align:center; margin-bottom:4px; }
        .bar-label { margin-top:10px; font-size:0.78rem; color:var(--text-secondary); }
        .bar-wa { background:var(--bar-whatsapp); }
        .bar-ig { background:var(--bar-instagram); }
        .bar-tk { background:#8b8b8b; }
        .bar-yt { background:var(--bar-youtube); }
        .bar-fb { background:var(--bar-facebook); }
        .bar-day { background:var(--accent); }
        .bar-day-high { background:#ef7a5a; }

        .activity-cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap:16px; }
        .activity-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius); padding:20px; display:flex; flex-direction:column; gap:10px; }
        .activity-card h4 { color:#fff; }
        .activity-card p { font-size:0.83rem; color:var(--text-secondary); }
        .activity-card .act-link { color:var(--accent); text-decoration:none; }
        .badge { display:inline-block; padding:4px 10px; border-radius:20px; font-size:0.72rem; }
        .badge-video { background:rgba(255,0,0,0.2); color:#ff6b6b; }
        .badge-pdf { background:rgba(240,160,80,0.2); color:#f0a050; }

        .profile-header { display:flex; align-items:center; gap:20px; margin-bottom:20px; }
        .profile-avatar { width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg, #5b8def, #3d6fd9); display:flex; align-items:center; justify-content:center; font-size:2.4rem; color:#fff; }
        .profile-info h3 { color:#fff; }
        .profile-email { color:var(--text-secondary); }
        .hours-danger { display:inline-block; padding:5px 12px; border-radius:20px; background:rgba(239,90,90,0.2); color:#f5a0a0; }
        .symptoms-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap:14px; }
        .symptom-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:16px; }
        .symptom-card.severe { border-left:3px solid var(--danger); }
        .symptom-card.moderate { border-left:3px solid var(--warning); }

        @media (max-width:768px) {
            .dashboard { flex-direction:column; }
            .sidebar { width:100%; min-width:100%; flex-direction:row; overflow-x:auto; padding:10px 8px; }
            .sidebar nav { flex-direction:row; }
            .sidebar nav a { padding:8px 10px; font-size:0.78rem; }
            .main-content { padding:16px; }
            .bar-chart { height:150px; }
        }
    </style>
</head>
<body>

    <div class="auth-container" id="authContainer">
        <div class="auth-card">
            <div class="logo-area">
                <div class="logo-icon">⚓</div>
                <h2>Ancla</h2>
                <p class="subtitle">Recupera el control de tu tiempo</p>
            </div>

            <div class="auth-form active" id="loginForm">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="loginUser" placeholder="Nombre de usuario" autocomplete="username">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password">
                    <i class="fa-solid fa-eye toggle-password" id="toggleLoginPass"></i>
                </div>
                <button class="btn-primary" id="btnLogin">
                    <i class="fa-solid fa-right-to-bracket"></i>&nbsp; Iniciar Sesión
                </button>
                <p class="auth-msg" id="loginMsg"></p>
                <p class="toggle-link">¿No tienes cuenta? <a id="linkToRegister">Regístrate aquí</a></p>
            </div>

            <div class="auth-form" id="registerForm">
                <div class="input-group">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="regName" placeholder="Nombre completo" autocomplete="name">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="regPass" placeholder="Contraseña (mín. 4 caracteres)" autocomplete="new-password">
                    <i class="fa-solid fa-eye toggle-password" id="toggleRegPass"></i>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-cake-candles"></i>
                    <input type="number" id="regAge" placeholder="Edad" min="10" max="99">
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="regEmail" placeholder="Correo electrónico" autocomplete="email">
                </div>
                <button class="btn-primary" id="btnRegistrar">
                    <i class="fa-solid fa-user-plus"></i>&nbsp; Registrarse
                </button>
                <p class="auth-msg" id="regMsg"></p>
                <p class="toggle-link">¿Ya tienes cuenta? <a id="linkToLogin">Inicia sesión</a></p>
            </div>
        </div>
    </div>

    <div class="dashboard" id="dashboard">
        <aside class="sidebar">
            <div class="side-logo"><span class="logo-dot">⚓</span> Ancla</div>
            <nav>
                <a class="active" data-section="estadisticas"><i class="fa-solid fa-chart-bar"></i> Estadísticas</a>
                <a data-section="actividades"><i class="fa-solid fa-person-running"></i> Actividades</a>
                <a data-section="perfil"><i class="fa-solid fa-id-card"></i> Perfil</a>
            </nav>
            <button class="logout-btn" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión</button>
        </aside>
        <main class="main-content" id="mainContent"></main>
    </div>

    <script>
        // ============ CONFIGURACIÓN DE SUPABASE ============
        // ⚠️ CAMBIA ESTOS 2 VALORES CON TUS DATOS REALES
        const SUPABASE_URL = 'https://oyncsuwelshqdjjukvia.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bmNzdXdlbHNocWRqanVrdmlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg2NjI4NjQsImV4cCI6MjA2NDIzODg2NH0.NfwvUJfSvQWVEcfdXKSvNAFQ1hD6jGd2GpdABj3YQT4';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let usuarioActual = null;

        // ============ MOSTRAR/OCULTAR CONTRASEÑA ============
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        // ============ ALTERNAR LOGIN/REGISTRO ============
        function toggleAuth(tipo) {
            document.getElementById('loginForm').classList.toggle('active', tipo === 'login');
            document.getElementById('registerForm').classList.toggle('active', tipo === 'register');
            document.getElementById('loginMsg').textContent = '';
            document.getElementById('regMsg').textContent = '';
        }

        // ============ REGISTRO ============
        async function registrar() {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const age = document.getElementById('regAge').value.trim();
            const msgEl = document.getElementById('regMsg');

            if (!name || !email || !pass || !age) {
                msgEl.textContent = 'Por favor, completa todos los campos.';
                msgEl.className = 'auth-msg error';
                return;
            }
            if (pass.length < 4) {
                msgEl.textContent = 'La contraseña debe tener al menos 4 caracteres.';
                msgEl.className = 'auth-msg error';
                return;
            }

            const { data, error } = await supabase.auth.signUp({
                email: email,
                password: pass,
                options: {
                    data: {
                        nombre: name,
                        edad: parseInt(age)
                    }
                }
            });

            if (error) {
                msgEl.textContent = error.message;
                msgEl.className = 'auth-msg error';
            } else {
                msgEl.textContent = '✅ Registro exitoso. Ahora inicia sesión.';
                msgEl.className = 'auth-msg success';
                document.getElementById('regName').value = '';
                document.getElementById('regPass').value = '';
                document.getElementById('regAge').value = '';
                document.getElementById('regEmail').value = '';
                setTimeout(() => toggleAuth('login'), 1500);
            }
        }

        // ============ INICIAR SESIÓN ============
        async function iniciarSesion() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const msgEl = document.getElementById('loginMsg');

            if (!user || !pass) {
                msgEl.textContent = 'Ingresa nombre de usuario y contraseña.';
                msgEl.className = 'auth-msg error';
                return;
            }

            const { data, error } = await supabase.auth.signInWithPassword({
                email: user,
                password: pass
            });

            if (error) {
                msgEl.textContent = 'Error al iniciar sesión. Verifica tus datos.';
                msgEl.className = 'auth-msg error';
            } else if (data?.user) {
                usuarioActual = {
                    email: data.user.email,
                    nombre: data.user.user_metadata?.nombre || 'Usuario',
                    edad: data.user.user_metadata?.edad || ''
                };
                abrirDashboard();
            }
        }

        // ============ VERIFICAR SESIÓN ============
        async function verificarSesion() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session?.user) {
                usuarioActual = {
                    email: session.user.email,
                    nombre: session.user.user_metadata?.nombre || 'Usuario',
                    edad: session.user.user_metadata?.edad || ''
                };
                abrirDashboard();
            } else {
                document.getElementById('authContainer').style.display = 'flex';
            }
        }

        // ============ ABRIR DASHBOARD ============
        function abrirDashboard() {
            document.getElementById('authContainer').style.display = 'none';
            document.getElementById('dashboard').classList.add('active');
            cargarContenidoDashboard();
            actualizarPerfil();
            cambiarSeccion('estadisticas', document.querySelector('.sidebar nav a[data-section="estadisticas"]'));
            setTimeout(animarBarras, 300);
        }

        // ============ CERRAR SESIÓN ============
        async function cerrarSesion() {
            await supabase.auth.signOut();
            usuarioActual = null;
            document.getElementById('dashboard').classList.remove('active');
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginMsg').textContent = '';
        }

        // ============ CAMBIAR SECCIÓN ============
        function cambiarSeccion(seccion, linkElement) {
            document.querySelectorAll('.section-panel').forEach(p => p.classList.remove('active'));
            const panel = document.getElementById('panel-' + seccion);
            if (panel) panel.classList.add('active');
            document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
            if (linkElement) linkElement.classList.add('active');
            if (seccion === 'estadisticas') setTimeout(animarBarras, 150);
            if (seccion === 'perfil') actualizarPerfil();
        }

        // ============ ACTUALIZAR PERFIL ============
        function actualizarPerfil() {
            if (!usuarioActual) return;
            document.getElementById('profileName').textContent = usuarioActual.nombre;
            document.getElementById('profileEmail').textContent = usuarioActual.email;
            const iniciales = usuarioActual.nombre.split(' ').map(w => w.charAt(0).toUpperCase()).slice(0, 2).join('');
            document.getElementById('profileAvatar').textContent = iniciales || 'U';
        }

        // ============ ANIMAR BARRAS ============
        function animarBarras() {
            document.querySelectorAll('.bar-chart .bar').forEach(bar => {
                const h = bar.style.height;
                bar.style.height = '0%';
                bar.style.transition = 'none';
                bar.offsetHeight;
                bar.style.transition = 'height 0.7s cubic-bezier(0.25, 0.8, 0.25, 1.2)';
                setTimeout(() => { bar.style.height = h; }, 30);
            });
        }

        // ============ CARGAR CONTENIDO DEL DASHBOARD ============
        function cargarContenidoDashboard() {
            const main = document.getElementById('mainContent');
            main.innerHTML = `
                <div class="section-panel active" id="panel-estadisticas">
                    <h2 class="section-title">📊 Estadísticas de uso</h2>
                    <p class="section-subtitle">Datos simulados de tu actividad digital</p>
                    <div class="cards-row">
                        <div class="stat-card"><div class="stat-icon red"><i class="fa-solid fa-clock"></i></div><div class="stat-info"><div class="stat-value">6.8 h</div><div class="stat-label">Promedio diario</div></div></div>
                        <div class="stat-card"><div class="stat-icon orange"><i class="fa-solid fa-mobile-screen"></i></div><div class="stat-info"><div class="stat-value">47.6 h</div><div class="stat-label">Total semanal</div></div></div>
                        <div class="stat-card"><div class="stat-icon blue"><i class="fa-solid fa-arrow-up"></i></div><div class="stat-info"><div class="stat-value">82</div><div class="stat-label">Desbloqueos/día</div></div></div>
                        <div class="stat-card"><div class="stat-icon orange"><i class="fa-solid fa-ranking-star"></i></div><div class="stat-info"><div class="stat-value">Top 12%</div><div class="stat-label">Entre usuarios</div></div></div>
                    </div>
                    <div class="chart-container" style="margin-bottom:18px;">
                        <h3>⏱️ Horas por aplicación (hoy)</h3>
                        <div class="bar-chart" id="barChartApps">
                            <div class="bar-wrapper"><div class="bar bar-wa" style="height:78%;"><span class="bar-value">2.3h</span></div><span class="bar-label">WhatsApp</span></div>
                            <div class="bar-wrapper"><div class="bar bar-ig" style="height:61%;"><span class="bar-value">1.8h</span></div><span class="bar-label">Instagram</span></div>
                            <div class="bar-wrapper"><div class="bar bar-tk" style="height:51%;"><span class="bar-value">1.5h</span></div><span class="bar-label">TikTok</span></div>
                            <div class="bar-wrapper"><div class="bar bar-yt" style="height:31%;"><span class="bar-value">0.9h</span></div><span class="bar-label">YouTube</span></div>
                            <div class="bar-wrapper"><div class="bar bar-fb" style="height:17%;"><span class="bar-value">0.5h</span></div><span class="bar-label">Facebook</span></div>
                        </div>
                    </div>
                    <div class="chart-container">
                        <h3>📅 Horas por día (esta semana)</h3>
                        <div class="bar-chart" id="barChartDays">
                            <div class="bar-wrapper"><div class="bar bar-day" style="height:68%;"><span class="bar-value">5.8h</span></div><span class="bar-label">Lun</span></div>
                            <div class="bar-wrapper"><div class="bar bar-day" style="height:73%;"><span class="bar-value">6.2h</span></div><span class="bar-label">Mar</span></div>
                            <div class="bar-wrapper"><div class="bar bar-day-high" style="height:84%;"><span class="bar-value">7.1h</span></div><span class="bar-label">Mié</span></div>
                            <div class="bar-wrapper"><div class="bar bar-day" style="height:76%;"><span class="bar-value">6.5h</span></div><span class="bar-label">Jue</span></div>
                            <div class="bar-wrapper"><div class="bar bar-day" style="height:70%;"><span class="bar-value">5.9h</span></div><span class="bar-label">Vie</span></div>
                            <div class="bar-wrapper"><div class="bar bar-day-high" style="height:98%;"><span class="bar-value">8.3h</span></div><span class="bar-label">Sáb</span></div>
                            <div class="bar-wrapper"><div class="bar bar-day-high" style="height:90%;"><span class="bar-value">7.6h</span></div><span class="bar-label">Dom</span></div>
                        </div>
                    </div>
                </div>

                <div class="section-panel" id="panel-actividades">
                    <h2 class="section-title">🏃 Actividades para reemplazar el celular</h2>
                    <p class="section-subtitle">Opciones saludables para invertir mejor tu tiempo</p>
